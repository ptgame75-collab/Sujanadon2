<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0084ff">
  <title>Message</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #ffffff;
    }
    .back-btn {
      text-decoration: none;
      color: #0084ff;
      font-size: 24px;
      margin-right: 10px;
      display: flex;
      align-items: center;
      line-height: 1;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-input-area {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background-color: #ffffff;
      border-top: 1px solid #e4e6eb;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="app-container" id="chatContainer">

    <!-- हेडर (ब्याक बटनले index.html मा फर्काउँछ) -->
    <header class="chat-header">
      <div class="header-left">
        <a href="index.html" class="back-btn" title="Back">❮</a>
        <img id="headerAvatar" src="Sujana.png" alt="Sujana Logo" class="avatar">
        <div class="user-info">
          <h2 id="headerName">सुजाना श्रेष्ठ</h2>
          <span id="headerStatus" class="status-text">Active now</span>
        </div>
      </div>
      <div class="header-right">
        <button id="openSettingsBtn" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- म्यासेज बबलहरू देखिने ठाउँ -->
    <main class="chat-messages" id="chatMessages"></main>

    <!-- म्यासेज लेख्ने र पठाउने बक्स -->
    <footer class="chat-input-area">
      <input type="text" id="messageInput" placeholder="म्यासेज लेख्नुहोस्..." autocomplete="off">
      <button id="sendBtn" class="send-btn">➤</button>
    </footer>

  </div>

  <!-- सेटिङ मोडल -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>एप सेटिङ (Customization)</h3>
        <button id="closeSettingsBtn" class="close-btn">✕</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label>नाम (Name):</label>
          <input type="text" id="settingName" placeholder="सुजाना श्रेष्ठ">
        </div>

        <div class="form-group">
          <label>फोन नम्बर (Phone Number):</label>
          <input type="text" id="settingPhone" placeholder="98XXXXXXXX">
        </div>

        <div class="form-group">
          <label>प्रोफाइल फोटो छान्नुहोस्:</label>
          <input type="file" id="settingAvatarFile" accept="image/*">
        </div>

        <div class="form-group">
          <label>च्याट वालपेपर (Wallpaper):</label>
          <input type="file" id="settingWallpaperFile" accept="image/*">
          <button type="button" id="resetWallpaperBtn" class="small-btn">वालपेपर हटाउनुहोस्</button>
        </div>

        <hr>

        <div class="form-group">
          <label>Gemini API Key (Smart AI रिप्लाईको लागि):</label>
          <input type="password" id="settingApiKey" placeholder="AIzaSy...">
        </div>

        <div class="form-group">
          <label>AI व्यवहार (Persona Prompt):</label>
          <textarea id="settingPersona" rows="4" placeholder="उहाँको बोल्ने शैली..."></textarea>
        </div>

        <hr>

        <div class="form-group">
          <label>निश्चित शब्द र उत्तर (Custom Rules):</label>
          <div class="rule-inputs">
            <input type="text" id="ruleTrigger" placeholder="तपाईँको म्यासेज">
            <input type="text" id="ruleReply" placeholder="उताको रिप्लाई">
            <button type="button" id="addRuleBtn" class="small-btn">थप्नुहोस्</button>
          </div>
          <ul id="rulesList" class="rules-list"></ul>
        </div>

        <div class="modal-actions">
          <button type="button" id="clearChatBtn" class="danger-btn">पुरानो च्याट मेटाउनुहोस्</button>
          <button type="button" id="saveSettingsBtn" class="primary-btn">सेभ गर्नुहोस्</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const defaultPersona = `तिमी 'सुजाना श्रेष्ठ' हौ र नेपाली वा रोमन नेपालीमा च्याट गर्छौ। तिम्रो स्वभाव अलि स्वाभिमानी, आफ्नो काममा व्यस्त रहने र सधैँ एकै किसिमको उत्तर नदिने खालको छ। म्यासेजको भाव र सन्दर्भ बुझेर छोटो (१-३ शब्द वा एक छोटो वाक्यमा) र प्राकृतिक उत्तर देऊ। सधैँ उही शब्द नदोहोराऊ र अनावश्यक लामा कुरा नगर।`;

    let appData = JSON.parse(localStorage.getItem('hybridChatData')) || {
      name: "सुजाना श्रेष्ठ",
      phone: "",
      avatar: "Sujana.png",
      wallpaper: "",
      apiKey: "",
      persona: defaultPersona,
      rules: [
        { trigger: "good morning", reply: "Morning" },
        { trigger: "gm", reply: "Morning" },
        { trigger: "hi", reply: "hlo" },
        { trigger: "hlo", reply: "hi" },
        { trigger: "k gardai xau", reply: "khai yestai ho" },
        { trigger: "khana vayo ta hrj", reply: "umm" },
        { trigger: "i love you", reply: "mero yad aako xa ke kya ho.?" }
      ],
      messages: []
    };

    let conversationState = {
      waitingForShayari: false,
      askedYad: false
    };

    const chatContainer = document.getElementById('chatContainer');
    const headerName = document.getElementById('headerName');
    const headerAvatar = document.getElementById('headerAvatar');
    const headerStatus = document.getElementById('headerStatus');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    const settingsModal = document.getElementById('settingsModal');
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const clearChatBtn = document.getElementById('clearChatBtn');

    function saveData() {
      localStorage.setItem('hybridChatData', JSON.stringify(appData));
    }

    function getDateTime() {
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const date = `${now.getDate()} ${months[now.getMonth()]}`;
      return { date, time };
    }

    function applySettingsToUI() {
      headerName.textContent = appData.name || "सुजाना श्रेष्ठ";
      headerAvatar.src = appData.avatar || "Sujana.png";

      if (appData.wallpaper) {
        chatContainer.style.backgroundImage = `url('${appData.wallpaper}')`;
        chatContainer.style.backgroundSize = "cover";
        chatContainer.style.backgroundPosition = "center";
      } else {
        chatContainer.style.backgroundImage = "none";
      }
      renderMessages();
    }

    function renderMessages() {
      chatMessages.innerHTML = '';
      appData.messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = `message ${msg.sender === 'user' ? 'sent' : 'received'}`;
        const timeDisplay = msg.date ? `${msg.date}, ${msg.time}` : msg.time;
        div.innerHTML = `
          <div class="bubble">${msg.text}</div>
          <span class="time">${timeDisplay}</span>
        `;
        chatMessages.appendChild(div);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function deliverBotReplies(repliesArray) {
      for (let i = 0; i < repliesArray.length; i++) {
        const replyText = repliesArray[i];
        const preDelay = i === 0 ? (Math.floor(Math.random() * 1200) + 800) : 1100;

        await new Promise(resolve => setTimeout(resolve, preDelay));
        headerStatus.textContent = "Typing...";
        headerStatus.classList.add('typing');

        const typingTime = Math.min(Math.max(replyText.length * 55, 900), 3000);
        await new Promise(resolve => setTimeout(resolve, typingTime));

        headerStatus.textContent = "Active now";
        headerStatus.classList.remove('typing');

        const dt = getDateTime();
        appData.messages.push({
          sender: 'bot',
          text: replyText,
          time: dt.time,
          date: dt.date
        });
        saveData();
        renderMessages();
      }
    }

    async function handleSendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      const dt = getDateTime();
      appData.messages.push({
        sender: 'user',
        text: text,
        time: dt.time,
        date: dt.date
      });
      messageInput.value = '';
      saveData();
      renderMessages();

      const replies = await buildRepliesForMessage(text);
      await deliverBotReplies(replies);
    }

    async function buildRepliesForMessage(userText) {
      const lower = userText.toLowerCase().trim();

      if (conversationState.waitingForShayari) {
        conversationState.waitingForShayari = false;
        return ["ramro xa .!"];
      }

      if (conversationState.askedYad && (lower === "xaina" || lower === "chaina" || lower === "xhaina")) {
        conversationState.askedYad = false;
        return ["kin ta .?"];
      }

      if (lower.includes("kasto vo aaja ko din") || lower.includes("aaja ko din kasto vo") || lower.includes("din kasto vo")) {
        return ["ramro vo", "temro kasto vo ta aaja KO din"];
      }

      if (lower.includes("birsako manxa") || lower.includes("mero sas") || lower.includes("yad garnu parxa")) {
        return ["time lai Kati Kura aauxa hai"];
      }

      if (lower.includes("shayari") || lower.includes("sayari")) {
        conversationState.waitingForShayari = true;
        return ["sunau ta"];
      }

      for (let rule of appData.rules) {
        if (lower === rule.trigger.toLowerCase().trim()) {
          if (rule.reply.includes("yad aako xa")) {
            conversationState.askedYad = true;
          }
          return [rule.reply];
        }
      }

      if (appData.apiKey) {
        try {
          const recentHistory = appData.messages.slice(-6).map(m => `${m.sender === 'user' ? 'User' : 'You'}: ${m.text}`).join("\n");
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${appData.apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `${appData.persona}\n\nपछिल्लो कुराकानी:\n${recentHistory}\n\nUser: "${userText}"\nभाव बुझेर छोटो र प्राकृतिक उत्तर देऊ:`
                }]
              }]
            })
          });
          const data = await response.json();
          if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
            return [data.candidates[0].content.parts[0].text.trim()];
          }
        } catch (error) {
          console.error("AI Error:", error);
        }
      }

      const fallbackReplies = ["umm", "khai", "thikai xa", "huss", "aile ali busy xu"];
      return [fallbackReplies[Math.floor(Math.random() * fallbackReplies.length)]];
    }

    sendBtn.addEventListener('click', handleSendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSendMessage();
    });

    openSettingsBtn.addEventListener('click', () => {
      document.getElementById('settingName').value = appData.name;
      document.getElementById('settingPhone').value = appData.phone;
      document.getElementById('settingApiKey').value = appData.apiKey;
      document.getElementById('settingPersona').value = appData.persona;
      renderRulesList();
      settingsModal.style.display = 'flex';
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    document.getElementById('settingAvatarFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => { appData.avatar = reader.result; };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('settingWallpaperFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => { appData.wallpaper = reader.result; };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('resetWallpaperBtn').addEventListener('click', () => {
      appData.wallpaper = "";
      alert("वालपेपर हटाइयो। सेभ गर्नुहोस्।");
    });

    function renderRulesList() {
      const list = document.getElementById('rulesList');
      list.innerHTML = '';
      appData.rules.forEach((rule, index) => {
        const li = document.createElement('li');
        li.innerHTML = `<span><b>${rule.trigger}</b> ➔ ${rule.reply}</span> <button onclick="deleteRule(${index})">✕</button>`;
        list.appendChild(li);
      });
    }

    window.deleteRule = function(index) {
      appData.rules.splice(index, 1);
      renderRulesList();
    };

    document.getElementById('addRuleBtn').addEventListener('click', () => {
      const trigger = document.getElementById('ruleTrigger').value.trim();
      const reply = document.getElementById('ruleReply').value.trim();
      if (trigger && reply) {
        appData.rules.push({ trigger, reply });
        document.getElementById('ruleTrigger').value = '';
        document.getElementById('ruleReply').value = '';
        renderRulesList();
      }
    });

    saveSettingsBtn.addEventListener('click', () => {
      appData.name = document.getElementById('settingName').value.trim() || "सुजाना श्रेष्ठ";
      appData.phone = document.getElementById('settingPhone').value.trim();
      appData.apiKey = document.getElementById('settingApiKey').value.trim();
      appData.persona = document.getElementById('settingPersona').value.trim() || defaultPersona;
      saveData();
      applySettingsToUI();
      settingsModal.style.display = 'none';
    });

    clearChatBtn.addEventListener('click', () => {
      if (confirm("के तपाईँ सबै पुरानो च्याट मेटाउन चाहनुहुन्छ?")) {
        appData.messages = [];
        conversationState = { waitingForShayari: false, askedYad: false };
        saveData();
        renderMessages();
        settingsModal.style.display = 'none';
      }
    });

    applySettingsToUI();
  </script>
</body>
</html>
