<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Messenger - Chats</title>
  <style>
    body {
      background-color: #fff;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .home-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      font-size: 24px;
      font-weight: bold;
      color: #000;
    }
    .search-bar-container {
      padding: 0 16px 10px 16px;
    }
    .search-bar {
      width: 100%;
      padding: 10px 15px;
      background-color: #f0f2f5;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }
    .chat-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      color: inherit;
    }
    .chat-item:hover {
      background-color: #f5f6f7;
    }
    .chat-avatar-container {
      position: relative;
      margin-right: 14px;
    }
    .chat-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
    }
    .online-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      background-color: #31a24c;
      border: 2px solid #fff;
      border-radius: 50%;
    }
    .chat-details {
      flex: 1;
      overflow: hidden;
    }
    .chat-name {
      font-size: 16px;
      font-weight: 600;
      color: #050505;
      margin: 0 0 4px 0;
    }
    .chat-last-msg {
      font-size: 14px;
      color: #65676b;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-meta {
      font-size: 12px;
      color: #65676b;
      text-align: right;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header class="home-header">
    <span>Chats</span>
  </header>

  <div class="search-bar-container">
    <input type="text" class="search-bar" placeholder="Search">
  </div>

  <ul class="chat-list">
    <!-- सुजानाको च्याटमा क्लिक गरेपछि index.html (च्याट बक्स) खुल्छ -->
    <a href="index.html" class="chat-item">
      <div class="chat-avatar-container">
        <img src="Sujana.png" alt="Sujana" class="chat-avatar" id="homeAvatar">
        <span class="online-badge"></span>
      </div>
      <div class="chat-details">
        <h4 class="chat-name" id="homeName">सुजाना श्रेष्ठ</h4>
        <p class="chat-last-msg" id="homeLastMsg">Active now</p>
      </div>
      <div class="chat-meta">
        <span id="homeTime">अहिले</span>
      </div>
    </a>
  </ul>

  <script>
    const savedData = JSON.parse(localStorage.getItem('hybridChatData'));
    if (savedData) {
      if (savedData.name) {
        document.getElementById('homeName').textContent = savedData.name;
      }
      if (savedData.avatar) {
        document.getElementById('homeAvatar').src = savedData.avatar;
      }
      if (savedData.messages && savedData.messages.length > 0) {
        const lastMsg = savedData.messages[savedData.messages.length - 1];
        document.getElementById('homeLastMsg').textContent = (lastMsg.sender === 'user' ? 'You: ' : '') + lastMsg.text;
        if (lastMsg.date && lastMsg.time) {
          document.getElementById('homeTime').textContent = `${lastMsg.date}, ${lastMsg.time}`;
        } else {
          document.getElementById('homeTime').textContent = lastMsg.time || 'अहिले';
        }
      }
    }
  </script>
</body>
</html>
